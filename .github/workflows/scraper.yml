name: 24-7 News Aggregator Pipeline

on:
  schedule:
    # 5 percenként fut le automatikusan
    - cron: '*/5 * * * *'
  # Lehetőséget ad arra, hogy a GitHub felületén kézzel is elindítsd
  workflow_dispatch:

jobs:
  run-aggregator:
    runs-on: ubuntu-latest

    steps:
    - name: Kód letöltése a tárhelyről
      uses: actions/checkout@v3

    - name: Python környezet beállítása
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Csomagok telepítése
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 1. Scraper & Párosító futtatása
      run: python weboldalparolas.py

    - name: 2. AI Szintézis & Fordítás futtatása
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python szintetizalt_hirek.py

    - name: Változások (friss JSON) mentése a GitHubra
      run: |
        git config --global user.name "Stirix Bot"
        git config --global user.email "bot@stirix.hu"
        git add szintetizalt_hirek.json erdelyi_hirek_memoria.json
        git commit -m "Automated news update [skip ci]" || exit 0
        git push
